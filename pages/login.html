<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | RPKL</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/output.css">
</head>

<body>
    <header class="site-header">

        <a href="index.html" class="logo">RPKL</a>

        <nav>
            <ul class="nav-links">

                <li><a href="../index.html">Home</a></li>

                <li><a href="about.html" class="active">About</a></li>

                <li><a href="divisions.html">Divisions</a></li>

                <li><a href="login.html">Login</a></li>

            </ul>
        </nav>

    </header>


    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">
                <h1>RPKL</h1>
                <p>Login to your account</p>
            </div>

            <form id="loginForm">

                <input id="username" type="text" placeholder="Enter username">

                <input id="password" type="password" placeholder="Enter password">

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="login-note">
                <p><strong>Account Access</strong></p>
                <p>
                    Member accounts are created by the RPKL administrator.
                    Please contact your division admin to obtain your username
                    and password.
                </p>
            </div>

        </section>

    </main>
    <script src="../js/login.js"></script>
</body>

</html>
