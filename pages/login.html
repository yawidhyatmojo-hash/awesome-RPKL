<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | RPKL</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/output.css">
</head>

<body>
    <header class="site-header">

        <a href="index.html" class="logo">RPKL</a>

        <button class="menu-toggle" id="menuToggle">
            ☰
        </button>

        <nav class="navbar" id="navbar">
            <ul class="nav-links">

                <li><a href="../index.html">Home</a></li>

                <li><a href="about.html" class="active">About</a></li>

                <li><a href="divisions.html">Divisions</a></li>

                <li><a href="login.html">Login</a></li>

            </ul>
        </nav>

    </header>


    <main class="login-page">

        <section class="login-card">

            <div class="login-header">
                <h1>RPKL</h1>
                <p>Login to your account</p>
            </div>

            <form id="loginForm" class="login-form">

                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password">
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <div class="login-info">
                <h4>Account Access</h4>
                <p>
                    Member accounts are created by the RPKL administrator.
                    Please contact your division admin to obtain your username
                    and password.
                </p>
            </div>

        </section>

    </main>
    <script src="../js/login.js"></script>
    <script src="../js/Script.js"></script>
</body>

</html>
